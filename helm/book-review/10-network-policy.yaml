apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-backend-ingress
  namespace: book-review
spec:
  podSelector:
    matchLabels:
      app: book-review-backend

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: book-review-frontend

        - podSelector:
            matchLabels:
              app: book-review-nginx

      ports:
        - protocol: TCP
          port: 3001
