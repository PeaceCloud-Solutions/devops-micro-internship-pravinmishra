apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-review-backend
  labels:
    app: book-review-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: book-review-backend

  template:
    metadata:
      labels:
        app: book-review-backend

    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001

          envFrom:
            - configMapRef:
                name: book-review-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: book-review-secrets
                  key: DB_USER

            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: book-review-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: book-review-secrets
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
