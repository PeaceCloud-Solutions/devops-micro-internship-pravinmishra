apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-review-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-review-nginx
  template:
    metadata:
      labels:
        app: book-review-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: book-review-nginx-config
